name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded pull request runs are cancelled. Each push to main gets its own group (the run id), so no later
# push can cancel it, running or pending: each main run may be waiting to publish its release.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  # Full gate: format, build, unit and integration tests, coverage, verify, read-only test, mutation check.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
      - run: dotnet --info
      - name: Release version
        run: echo "VERSION=$(scripts/release-version.sh "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - run: scripts/check.sh --mutation
      - name: Benchmark (R11 targets)
        run: scripts/bench.sh
      - name: Smoke test the release binary
        run: |
          scripts/build-release.sh "$VERSION" dist linux-x64
          scripts/smoke.sh dist/ucl-linux-x64/ucl "$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # The documented local path on Windows: Git Bash, core.autocrlf=true (the Git for Windows default).
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Set core.autocrlf=true before checkout
        run: git config --global core.autocrlf true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert the autocrlf checkout left text files with LF
        run: |
          if git ls-files -z --eol | tr '\0' '\n' | grep -E '^i/lf +w/crlf'; then
            echo "working-tree files converted to CRLF"; exit 1
          fi
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
      - run: scripts/check.sh

  # Smoke test on Apple silicon: build, run the CLI on fixtures.
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
      - name: Release version
        run: echo "VERSION=$(scripts/release-version.sh "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - name: Build release binary and smoke test it
        run: |
          scripts/build-release.sh "$VERSION" dist osx-arm64
          scripts/smoke.sh dist/ucl-osx-arm64/ucl "$VERSION"

  # On a push to main, after all three gates: build the four single-file binaries and the global tool package
  # and publish them as release v0.<minor>.<run number> (scripts/release-version.sh). The only job with write
  # permission. Publishing to NuGet is not automated (no API key is configured); see docs/status.md.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Release version
        run: echo "VERSION=$(scripts/release-version.sh "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - name: Build release artifacts
        run: scripts/build-release.sh "$VERSION" dist
      - name: Verify the artifacts
        run: |
          case $VERSION in v0.[0-9]*.[0-9]*) ;; *) echo "bad version $VERSION"; exit 1 ;; esac
          (cd dist && sha256sum --check SHA256SUMS)
          test "$(ls dist | wc -l)" -eq 8
          ls -l dist
      - name: Create the release (idempotent; never moves a tag)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=$VERSION
          # An existing tag must already point at this commit.
          if sha=$(gh api "repos/$GH_REPO/commits/tags/$tag" --jq .sha 2>/dev/null); then
            if [ "$sha" != "$GITHUB_SHA" ]; then
              echo "tag $tag exists at $sha, not $GITHUB_SHA; refusing to move it"; exit 1
            fi
            echo "tag $tag already exists at this commit"
          fi
          notes="Automatic release of $GITHUB_SHA after the Linux, Windows and macOS CI gates passed (run $GITHUB_RUN_ID). 'ucl --version' prints $tag. Changes: CHANGELOG.md. Verify downloads with: sha256sum --check SHA256SUMS"
          if gh release view "$tag" >/dev/null 2>&1; then
            # A rerun. Published assets are never deleted or replaced; release builds are not byte-for-byte
            # reproducible, so a rerun uploads only assets that are missing and leaves the rest as they are.
            names=$(gh release view "$tag" --json assets --jq '.assets[].name')
            missing=()
            for f in dist/*; do
              grep -qxF "$(basename "$f")" <<<"$names" || missing+=("$f")
            done
            if [ ${#missing[@]} -gt 0 ] && [ ${#missing[@]} -lt "$(ls dist | wc -l)" ]; then
              echo "$tag: some assets exist and some are missing; refusing to mix two builds under one SHA256SUMS"; exit 1
            fi
            if [ ${#missing[@]} -gt 0 ]; then
              gh release upload "$tag" "${missing[@]}"
            fi
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true ]; then
              gh release edit "$tag" --draft=false
            fi
            echo "release $tag already existed; ${#missing[@]} asset(s) uploaded"
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "$tag" --notes "$notes" --latest=false
          fi
          # Mark as latest only if no higher v0.x.y release exists (main runs can finish out of order).
          highest=$(gh release list --limit 200 --exclude-drafts --json tagName --jq '.[].tagName' | grep -E '^v0\.[0-9]+\.[0-9]+$' | sort -t. -k2,2n -k3,3n | tail -1)
          if [ "$highest" = "$tag" ]; then
            gh release edit "$tag" --latest
          fi
          gh release view "$tag"
